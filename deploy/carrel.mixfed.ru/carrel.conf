# Carrel (docker compose in /opt/carrel) behind apache2:
# 127.0.0.1:8090 — pages, 127.0.0.1:8091 — davloom under /dav/.
# Goes to /etc/apache2/sites-available/carrel.conf only after the first
# administrator is made through an SSH tunnel: an empty instance gives
# the administrator to whoever opens it first (S-10.1).
<VirtualHost *:80>
    ServerName carrel.mixfed.ru
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName carrel.mixfed.ru
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/carrel.mixfed.ru/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/carrel.mixfed.ru/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # The client's own X-Forwarded-For is dropped; mod_proxy sets the
    # client's address itself, and Carrel believes only the gateway of its
    # docker network (CARREL_TRUSTED_PROXIES).
    RequestHeader unset X-Forwarded-For
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPreserveHost On

    # A collection's address travels as %2F in the path (C-5): it must
    # reach Carrel undecoded, on both ports (README, «Behind a reverse
    # proxy»).
    AllowEncodedSlashes NoDecode
    ProxyPass        "/dav/" "http://127.0.0.1:8091/dav/" nocanon timeout=300
    ProxyPassReverse "/dav/" "http://127.0.0.1:8091/dav/"
    ProxyPass        "/"     "http://127.0.0.1:8090/" nocanon timeout=300 flushpackets=on
    ProxyPassReverse "/"     "http://127.0.0.1:8090/"

    # Carrel sets no ceiling on a file.
    LimitRequestBody 0
    # The event stream of a poll is not to be buffered by mod_deflate.
    SetEnvIfNoCase Accept "text/event-stream" no-gzip

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
</VirtualHost>
