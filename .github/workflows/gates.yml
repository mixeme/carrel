name: Gates

# The gates of carrel/server/scripts/gates.sh (docs/development.md, «Ворота и
# проверки») on GitHub, where the repository is a mirror of Gitea: gofmt, go
# vet, the server's and the client's tests, docs/spec/check.py. The Linux
# gates with the DAV stands, -race and the image smoke stay on the Linux
# machine (scripts/linux-gates.sh): they need the stands.
#
# The build needs Typecase beside this repository, as on a developer's
# machine: the client's go.mod replaces carrel.dev/typecase with
# ../../../typecase. So the workspace holds carrel/ (this repository) and
# typecase/ (the commit of «Typecase сборки» in docs/plan/client.md, as
# linux-ship.sh and deploy.sh take it). Typecase is read from
# vars.TYPECASE_REPO, by default <owner>/typecase; a private one needs
# secrets.TYPECASE_TOKEN, a token that may read it.
#
# image.yml calls this file: no image is published while these gates are red
# on the same commit.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: carrel

      - name: Typecase at the client plan's commit
        env:
          TOKEN: ${{ secrets.TYPECASE_TOKEN || github.token }}
          REPO: ${{ vars.TYPECASE_REPO || format('{0}/typecase', github.repository_owner) }}
        run: |
          set -euo pipefail
          tc=$(sed -n 's/^Typecase сборки: `\([0-9a-f]\{7,40\}\)`.*/\1/p' carrel/docs/plan/client.md)
          if [ "$(printf '%s\n' "$tc" | grep -c .)" != 1 ]; then
            echo "::error::docs/plan/client.md: want exactly one line «Typecase сборки: \`<commit>\`»"
            exit 1
          fi
          git clone --quiet --filter=blob:none "https://x-access-token:${TOKEN}@github.com/${REPO}.git" typecase
          git -C typecase checkout --quiet --detach "$tc"
          echo "Typecase $(git -C typecase rev-parse --short HEAD) from ${REPO}"

      - uses: actions/setup-go@v5
        with:
          go-version-file: carrel/carrel/server/go.mod
          cache-dependency-path: |
            carrel/carrel/server/go.sum
            carrel/carrel/client/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: gates.sh
        run: bash carrel/carrel/server/scripts/gates.sh
