{{define "body"}}
<section class="auth-card">
    <h1 class="visually-hidden">Sign in</h1>
    <div class="auth-brand">{{template "logo"}}</div>
    <p class="auth-tagline"><strong>{{.Tagline1}}</strong><br>{{.Tagline2}}</p>

    <form method="post" class="m-form" action="{{.Base}}/login">
        <input type="hidden" name="csrf_token" value="{{.CSRF}}">
        {{with .Data}}{{if .Next}}<input type="hidden" name="next" value="{{.Next}}">{{end}}{{end}}

        <div class="m-f w-full">
            <label for="login">Login</label>
            <input id="login" name="login" type="text" required autofocus
                   maxlength="64" autocapitalize="none" spellcheck="false"
                   autocomplete="username"
                   value="{{with .Data}}{{.Login}}{{end}}" class="m-in">
        </div>

        <div class="m-f w-full">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required
                   autocomplete="current-password" class="m-in">
        </div>

        <div class="m-formfoot">
            <button type="submit" class="m-btn is-primary auth-submit">Sign in</button>
        </div>
    </form>

    {{with .Data}}{{if .CanRegister}}
    <p class="hint"><a href="{{$.Base}}/register">Create an account</a></p>
    {{end}}{{end}}

    <p class="hint"><a href="{{.Base}}/forgot">Forgotten your password?</a></p>
</section>
{{end}}
