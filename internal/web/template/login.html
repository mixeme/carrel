{{define "body"}}
<section class="card">
    <h1>Sign in</h1>

    <form method="post" action="{{.Base}}/login">
        <input type="hidden" name="csrf_token" value="{{.CSRF}}">
        {{with .Data}}{{if .Next}}<input type="hidden" name="next" value="{{.Next}}">{{end}}{{end}}

        <label for="login">Login</label>
        <input id="login" name="login" type="text" required autofocus
               maxlength="64" autocapitalize="none" spellcheck="false"
               autocomplete="username"
               value="{{with .Data}}{{.Login}}{{end}}">

        <label for="password">Password</label>
        <input id="password" name="password" type="password" required
               autocomplete="current-password">

        <button type="submit">Sign in</button>
    </form>

    {{with .Data}}{{if .CanRegister}}
    <p class="hint"><a href="{{$.Base}}/register">Create an account</a></p>
    {{end}}{{end}}

    <p class="hint"><a href="{{.Base}}/forgot">Forgotten your password?</a></p>
</section>
{{end}}
