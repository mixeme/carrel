{{define "body"}}
{{$d := .Data}}
{{if $d.Crop}}
<div id="photo-crop" class="photo-crop">
    <div class="crop-canvas-wrap" data-crop-canvas>
        <img class="crop-source" src="{{$d.Crop.Preview}}?t=0-1" alt="Crop source" data-crop-img crossorigin>
        <div class="crop-frame" data-crop-frame></div>
    </div>
    <img class="contact-photo crop-result" src="{{$d.Crop.Preview}}?t={{$d.Crop.Rotate}}-{{$d.Crop.Zoom}}" alt="Crop preview" width="128" height="128" data-crop-result>
    <form method="post" action="{{.Base}}/app/contacts/{{$d.AccountID}}/{{$d.ColEnc}}/{{$d.UID}}"
          hx-post="{{.Base}}/app/contacts/{{$d.AccountID}}/{{$d.ColEnc}}/{{$d.UID}}"
          hx-target="#photo-crop" hx-swap="outerHTML"
          hx-headers='{"X-CSRF-Token": "{{.CSRF}}"}' data-crop-form>
        <input type="hidden" name="csrf_token" value="{{.CSRF}}">
        <input type="hidden" name="action" value="crop_photo">
        <input type="hidden" name="etag" value="{{$d.ETag}}">
        <input type="hidden" name="pan_x" value="{{$d.Crop.PanX}}" data-crop-pan-x>
        <input type="hidden" name="pan_y" value="{{$d.Crop.PanY}}" data-crop-pan-y>
        <input type="hidden" name="zoom" value="{{if $d.Crop.Zoom}}{{$d.Crop.Zoom}}{{else}}1{{end}}" data-crop-zoom>
        <input type="hidden" name="rotate" value="{{$d.Crop.Rotate}}" data-crop-rotate>
        <details class="crop-numbers">
            <summary>Adjust by numbers</summary>
            <label>Pan X <input type="number" step="0.1" min="-1" max="1" value="{{$d.Crop.PanX}}" data-crop-num="pan_x" class="m-in"></label>
            <label>Pan Y <input type="number" step="0.1" min="-1" max="1" value="{{$d.Crop.PanY}}" data-crop-num="pan_y" class="m-in"></label>
            <label>Zoom <input type="number" step="0.1" min="1" max="8" value="{{if $d.Crop.Zoom}}{{$d.Crop.Zoom}}{{else}}1{{end}}" data-crop-num="zoom" class="m-in"></label>
            <label>Rotate
                <select data-crop-num="rotate" class="m-in">
                    <option value="0"{{if eq $d.Crop.Rotate 0}} selected{{end}}>0°</option>
                    <option value="90"{{if eq $d.Crop.Rotate 90}} selected{{end}}>90°</option>
                    <option value="180"{{if eq $d.Crop.Rotate 180}} selected{{end}}>180°</option>
                    <option value="270"{{if eq $d.Crop.Rotate 270}} selected{{end}}>270°</option>
                </select>
            </label>
        </details>
        <button type="submit" class="crop-apply">Update preview</button>
        {{/* §13: on a narrow screen the crop is the centred square and nothing
             else — the canvas and the numbers are both hidden by CSS. */}}
        <p class="crop-narrow-note hint">Cropped to the centre of the photo. Adjust it on a wider screen.</p>
    </form>
    <form method="post" action="{{.Base}}/app/contacts/{{$d.AccountID}}/{{$d.ColEnc}}/{{$d.UID}}">
        <input type="hidden" name="csrf_token" value="{{.CSRF}}">
        <input type="hidden" name="action" value="confirm_photo">
        <input type="hidden" name="etag" value="{{$d.ETag}}">
        <button type="submit" class="m-btn">Save photo</button>
    </form>
    <form method="post" action="{{.Base}}/app/contacts/{{$d.AccountID}}/{{$d.ColEnc}}/{{$d.UID}}">
        <input type="hidden" name="csrf_token" value="{{.CSRF}}">
        <input type="hidden" name="action" value="cancel_photo">
        <button type="submit" class="link">Cancel crop</button>
    </form>
</div>
{{end}}
{{end}}
