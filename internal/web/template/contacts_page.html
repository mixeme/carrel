{{define "body"}}
{{$d := .Data}}
{{range $d.Contacts}}
<li class="list-row list-row--contact contact-row">
    <span class="list-bar" style="background:{{if $d.Collection.Color}}{{$d.Collection.Color}}{{else}}var(--accent){{end}}"></span>
    <a class="contact-row-link" href="{{$.Base}}/app/contacts/{{$d.AccountID}}/{{$d.ColEnc}}/{{.UID}}">
        <img class="list-avatar contact-avatar print-photo" src="{{.PhotoURL}}" alt="" width="28" height="28">
        <span class="list-title"><strong>{{.DisplayName}}</strong></span>
        <span class="list-sub">{{.Phones}}</span>
        <span class="list-sub">{{.Emails}}</span>
    </a>
    <span class="list-end">{{if .Linked}}<a class="dup-badge is-linked no-print" href="{{.DupURL}}" title="Linked with {{.Linked}} records in all">linked ×{{.Linked}}</a>{{end}}</span>
</li>
{{end}}
{{if $d.HasMore}}
<div class="no-print" hx-get="{{.Base}}/app/contacts/{{$d.AccountID}}/{{$d.ColEnc}}/page?offset={{$d.NextOffset}}"
     hx-trigger="revealed"
     hx-swap="outerHTML"
     hx-headers='{"X-CSRF-Token": "{{.CSRF}}"}'>
    <p class="hint">Loading more…</p>
</div>
{{end}}
{{end}}
