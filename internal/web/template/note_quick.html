{{define "body"}}
{{$d := .Data}}
<div class="app-main quick-note-page">
    <section class="card">
        <h1>New note</h1>
        {{if $d.HasTarget}}
        <p class="source-label">Filed in {{$d.Target.Label}} · {{$d.Target.AccountLabel}}</p>
        <form method="post" action="{{.Base}}/app/notes/quick">
            <input type="hidden" name="csrf_token" value="{{.CSRF}}">
            <input type="hidden" name="back" value="{{$d.Back}}">
            <label for="body">Note</label>
            <textarea id="body" name="body" rows="10" autofocus placeholder="Write it down; the title is taken from the first line."></textarea>
            {{if gt (len $d.Sources) 1}}
            <label for="source">Notebook</label>
            <select id="source" name="source">
            {{range $d.Sources}}
                <option value="{{.Key}}"{{if eq .Key $d.Target.Key}} selected{{end}}>{{.Label}} · {{.AccountLabel}}</option>
            {{end}}
            </select>
            {{end}}
            <button type="submit">Save note</button>
            <a class="link" href="{{$d.Back}}">Cancel</a>
        </form>
        {{else}}
        <p class="hint">No writable notebook is connected. Connect a CalDAV account from your <a href="{{.Base}}/app/">profile</a> first.</p>
        {{end}}
    </section>
</div>
{{end}}
