{{define "body"}}
{{$d := .Data}}
<section class="auth-card is-wide">
    <h1>Change password</h1>
    {{if $d.Forced}}
    <p class="warning">You are signed in with a temporary password. Choose a
        new one before continuing.</p>
    {{else}}
    <p class="hint">Your data stays encrypted under the same key; only the
        wrapping changes.</p>
    {{end}}

    <form method="post" class="m-form" action="{{.Base}}/app/password">
        <input type="hidden" name="csrf_token" value="{{.CSRF}}">

        <div class="m-f w-full">
            <label for="current-password">Current password</label>
            <input id="current-password" name="current_password" type="password" required
                   autocomplete="current-password" class="m-in">
        </div>

        <div class="m-f w-full">
            <label for="new-password">New password</label>
            <input id="new-password" name="new_password" type="password" required
                   minlength="10" autocomplete="new-password" class="m-in">
        </div>

        <div class="m-f w-full">
            <label for="confirm-password">Repeat new password</label>
            <input id="confirm-password" name="confirm" type="password" required
                   minlength="10" autocomplete="new-password" class="m-in">
        </div>

        <div class="m-formfoot">
            <button type="submit" class="m-btn">Change password</button>
        </div>
    </form>

    {{if not $d.Forced}}
    <p><a href="{{.Base}}/app/settings/account">Back to account</a></p>
    {{end}}
</section>
{{end}}
