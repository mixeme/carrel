{{define "body"}}
{{$d := .Data}}
<section class="card">
    <h1>Change password</h1>
    {{if $d.Forced}}
    <p class="warning">You are signed in with a temporary password. Choose a
        new one before continuing.</p>
    {{else}}
    <p class="hint">Your data stays encrypted under the same key; only the
        wrapping changes.</p>
    {{end}}

    <form method="post" action="{{.Base}}/app/password">
        <input type="hidden" name="csrf_token" value="{{.CSRF}}">

        <label for="current-password">Current password</label>
        <input id="current-password" name="current_password" type="password" required
               autocomplete="current-password">

        <label for="new-password">New password</label>
        <input id="new-password" name="new_password" type="password" required
               minlength="10" autocomplete="new-password">

        <label for="confirm-password">Repeat new password</label>
        <input id="confirm-password" name="confirm" type="password" required
               minlength="10" autocomplete="new-password">

        <button type="submit">Change password</button>
    </form>

    {{if not $d.Forced}}
    <p><a href="{{.Base}}/app/">Back to profile</a></p>
    {{end}}
</section>
{{end}}
