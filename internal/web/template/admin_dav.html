{{define "body"}}
{{$d := .Data}}
<section class="card admin-panel">
    <h1>Administration</h1>
    {{template "adminnav" .}}

    <section class="subsection">
        <h2>DAV server validator</h2>
        <p class="hint">Runs discovery without saving credentials. Useful before
            handing connection details to a user.</p>
        <form method="post" action="{{.Base}}/admin/dav">
            <input type="hidden" name="csrf_token" value="{{.CSRF}}">
            <input type="hidden" name="action" value="test_dav">

            <label for="dav-test-url">Server URL</label>
            <input id="dav-test-url" name="dav_test_url" type="url" required
                   placeholder="https://host/dav.php/" autocapitalize="none" spellcheck="false">

            <label for="dav-test-user">Username</label>
            <input id="dav-test-user" name="dav_test_username" type="text" required
                   autocapitalize="none" spellcheck="false">

            <label for="dav-test-pass">Password</label>
            <input id="dav-test-pass" name="dav_test_password" type="password" required
                   autocomplete="off">

            <button type="submit">Test discovery</button>
        </form>

        {{if $d.DAVDiag}}
        <h3>Discovery trace</h3>
        <pre class="diagnostic">{{$d.DAVDiag}}</pre>
        {{end}}
    </section>
</section>
{{end}}
