{{define "base"}}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#4A6B52">
    <title>{{if .Title}}{{.Title}} · Carrel{{else}}Carrel{{end}}</title>
    <link rel="stylesheet" href="{{.Base}}/static/carrel.css">
    <link rel="icon" href="{{.Base}}/static/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{{.Base}}/static/icon.svg">
    <link rel="manifest" href="{{.Base}}/manifest.webmanifest">
    <script src="{{.Base}}/static/htmx.min.js" defer></script>
    <script src="{{.Base}}/static/carrel.js" defer></script>
</head>
<body>
{{if .Session}}
<header class="topbar">
    <a class="brand" href="{{.Base}}/app/">Carrel</a>
    <nav>
        <a href="{{.Base}}/app/"{{if eq .Title "Carrel"}} aria-current="page"{{end}}>Profile</a>
        <a href="{{.Base}}/app/contacts"{{if or (eq .Title "Contacts") (eq .Title "New contact") (eq .Title "Conflict")}} aria-current="page"{{end}}>Contacts</a>
        {{if .Admin}}<a href="{{.Base}}/admin/"{{if eq .Title "Administration"}} aria-current="page"{{end}}>Administration</a>{{end}}
        <form method="post" action="{{.Base}}/app/" class="inline-form">
            <input type="hidden" name="csrf_token" value="{{.CSRF}}">
            <input type="hidden" name="action" value="refresh_cache">
            <button type="submit" class="link">Refresh</button>
        </form>
        <form method="post" action="{{.Base}}/logout">
            <input type="hidden" name="csrf_token" value="{{.CSRF}}">
            <button type="submit" class="link">Sign out</button>
        </form>
    </nav>
</header>
{{end}}
<main>
    {{if .Error}}<p class="message error" role="alert">{{.Error}}</p>{{end}}
    {{if .Notice}}<p class="message notice">{{.Notice}}</p>{{end}}
    {{block "body" .}}{{end}}
</main>
<footer class="site-footer">
    <a href="{{.Base}}/about">About this service</a>
</footer>
</body>
</html>
{{end}}
