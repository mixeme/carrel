{{define "body"}}
{{$d := .Data}}
{{range $d.Children}}
<div{{if .ReadOnly}} class="is-disabled"{{end}}
     role="treeitem" data-picker-node data-account="{{.AccountID}}" data-col="{{.ColEnc}}" data-folder="{{.Folder}}"
     {{if not .ReadOnly}}tabindex="0"{{end}} data-depth="1">
    <span>{{.Name}}</span>
</div>
{{end}}
{{end}}
