{{define "body"}}
{{$d := .Data}}
{{range $d.Children}}
<div class="folder-tree-node{{if .ReadOnly}} is-disabled{{end}}"
     role="treeitem" data-picker-node data-account="{{.AccountID}}" data-col="{{.ColEnc}}" data-folder="{{.Folder}}"
     {{if not .ReadOnly}}tabindex="0"{{end}} style="padding-left:1.25rem">
    <span class="folder-tree-label">{{.Name}}</span>
</div>
{{end}}
{{end}}
