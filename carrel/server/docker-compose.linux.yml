# Manual stack for the Linux dev machine (docs/plan/server.md, «Linux-машина»).
# Not used in GitHub Actions — start locally before integration tests.
services:
  radicale:
    image: tomsquest/docker-radicale:3.5.4.0
    ports:
      - "127.0.0.1:5232:5232"
    volumes:
      - ./testdata/radicale/config:/config/config:ro
      - ./testdata/radicale/users:/config/users:ro
      - radicale-data:/data

  # Stalwart: the fourth engine, and the only one on Rust. Its CalDAV and
  # CardDAV share no ancestry with sabre/dav, Radicale or SoGo, so it is
  # the server most likely to tell us something new.
  #
  # NOT YET RUN: written from the documentation on 22.09.2026 on a machine
  # without Docker. See testdata/stalwart/README.md for what is a guess and
  # where to look when it does not come up first time.
  stalwart:
    image: stalwartlabs/stalwart:v0.16
    ports:
      - "127.0.0.1:8088:8088"
      # 8080 снаружи занят SelfPost на этой машине, и Docker отказывает в
      # привязке (прогон 22.09.2026). Внутри контейнера слушатель настройки
      # остаётся на 8080 — stalwart-setup ходит к нему по сети compose.
      - "127.0.0.1:8089:8080"
    environment:
      # A fixed administrator instead of the random one the first start
      # prints, and the recovery listener on 8080 that stalwart-setup
      # talks to. Both are here because this is a test stand on loopback,
      # and neither belongs on a server anyone can reach.
      STALWART_RECOVERY_ADMIN: "admin:carrel-admin"
      STALWART_RECOVERY_MODE: "1"
    volumes:
      - ./testdata/stalwart/config.json:/etc/stalwart/config.json:ro
      - stalwart-data:/var/lib/stalwart

  # One shot: the domain, the account with its password, the DAV listener,
  # and a settings reload — listeners are parsed into a snapshot at start
  # and a saved object alone does not reach the running server.
  stalwart-setup:
    image: stalwartlabs/cli
    depends_on:
      - stalwart
    environment:
      STALWART_URL: "http://stalwart:8080"
      STALWART_USER: "admin"
      STALWART_PASSWORD: "carrel-admin"
    volumes:
      - ./testdata/stalwart:/work:ro
    working_dir: /work
    # No entrypoint of our own: the image's own entrypoint is the CLI, and
    # it has no shell to wrap it in — the first live run answered
    # `exec: "sh": executable file not found in $PATH` (22.09.2026). The
    # gates pass the arguments instead, once per command.
    profiles:
      - setup


  # Xandikos: the second light engine beside Radicale, sharing no code
  # with it — Python, every collection a git repository. It asks for no
  # credentials; a bare instance is meant to sit behind a proxy that does
  # the asking, and on loopback there is nothing to protect. That makes it
  # the one server in the lineup where Carrel connects with a login and no
  # password at all.
  #
  # DEFAULTS makes the first calendar and address book, without which the
  # server starts empty and discovery has nothing to find.
  xandikos:
    # A release, not :latest. On 22.09.2026 :latest answered every
    # addressbook-query with 500 and an AttributeError of its own
    # ('CardDAVFilter' object has no attribute 'add_prop_filter'); every
    # released tag from v0.2.10 to v0.2.12 answered 207. Pinning :latest
    # for a stand means testing against whatever is broken upstream today,
    # and it cost an afternoon that looked like a server behaviour worth
    # recording.
    image: ghcr.io/jelmer/xandikos:v0.2.12
    # The release images run as a user that cannot write a fresh named
    # volume — they die with PermissionError on /data/user/ — while
    # :latest can. This is a stand on loopback with a throwaway volume,
    # so root is the cheap answer; a production deployment would give the
    # volume the right owner instead.
    user: "root"
    ports:
      - "127.0.0.1:8081:8000"
    environment:
      DEFAULTS: "true"
      AUTOCREATE: "true"
      CURRENT_USER_PRINCIPAL: "/user/"
    volumes:
      - xandikos-data:/data


  # Davis: sabre/dav with a Symfony admin over it — the same engine as
  # Baikal and Nextcloud, so it is here for completeness rather than for
  # news. The standalone image carries Caddy, so it is one container and
  # not the nginx-plus-FPM pair the project's own compose files use.
  #
  # NOT YET RUN: written from the project's documentation and its own
  # compose examples on 22.09.2026, on a machine without Docker. See
  # testdata/davis/README.md — and note that its DAV account is made by
  # hand, once, in the admin screens.
  davis:
    image: ghcr.io/tchapi/davis-standalone:latest
    ports:
      - "127.0.0.1:8082:9000"
    environment:
      APP_ENV: "prod"
      APP_SECRET: "carrel-stand-not-a-secret"
      APP_TIMEZONE: "Europe/Moscow"
      # Four slashes: an absolute path, and no quotes, so Symfony resolves it.
      DATABASE_DRIVER: "sqlite"
      DATABASE_URL: sqlite:////data/davis-database.db
      # The admin screens, where the one DAV account is made by hand.
      ADMIN_LOGIN: "admin"
      ADMIN_PASSWORD: "carrel-admin"
      ADMIN_AUTH_BYPASS: "false"
      AUTH_METHOD: "Basic"
      AUTH_REALM: "SabreDAV"
      CALDAV_ENABLED: "true"
      CARDDAV_ENABLED: "true"
      # Davis's WebDAV wants directories of its own; Carrel asks this stand
      # for calendars and contacts, and finds no file root, as it finds none
      # on SoGo or Yandex.
      WEBDAV_ENABLED: "false"
    volumes:
      - davis-data:/data

  # One shot: the migrations, which Davis does not run for itself. Until
  # they have run the database has no tables and every screen is a 500.
  davis-setup:
    image: ghcr.io/tchapi/davis-standalone:latest
    depends_on:
      - davis
    environment:
      APP_ENV: "prod"
      APP_SECRET: "carrel-stand-not-a-secret"
      DATABASE_DRIVER: "sqlite"
      DATABASE_URL: sqlite:////data/davis-database.db
    volumes:
      - davis-data:/data
    entrypoint:
      - sh
      - -c
      - "bin/console doctrine:migrations:migrate --no-interaction && chown -R $$(id -u):$$(id -g) /data"
    profiles:
      - setup

volumes:
  radicale-data:
  stalwart-data:
  xandikos-data:
  davis-data:
