# Manual stack for the Linux dev machine (docs/plan/server.md, «Linux-машина»).
# Not used in GitHub Actions — start locally before integration tests.
services:
  radicale:
    image: tomsquest/docker-radicale:3.5.4.0
    ports:
      - "127.0.0.1:5232:5232"
    volumes:
      - ./testdata/radicale/config:/config/config:ro
      - ./testdata/radicale/users:/config/users:ro
      - radicale-data:/data

  # Stalwart: the fourth engine, and the only one on Rust. Its CalDAV and
  # CardDAV share no ancestry with sabre/dav, Radicale or SoGo, so it is
  # the server most likely to tell us something new.
  #
  # NOT YET RUN: written from the documentation on 22.09.2026 on a machine
  # without Docker. See testdata/stalwart/README.md for what is a guess and
  # where to look when it does not come up first time.
  stalwart:
    image: stalwartlabs/stalwart:v0.16
    ports:
      # Two listeners, and they are not interchangeable. The one the plan
      # creates (8088) serves DAV. The recovery one (8080 inside) serves the
      # management API and **only** that: in recovery mode an ordinary
      # account authenticates and is then refused — the server's own log
      # says «Unauthorized access … details = authenticate» — and even the
      # administrator's DAV homes answer 404. Found on 23.09.2026, after an
      # afternoon of taking that refusal for a missing permission.
      # 8080 outside is SelfPost's on this machine, so the recovery port is
      # published as 8089.
      - "127.0.0.1:8088:8088"
      - "127.0.0.1:8089:8080"
    environment:
      # A fixed administrator instead of the random one the first start
      # prints, and the recovery listener on 8080 that stalwart-setup
      # talks to. Both are here because this is a test stand on loopback,
      # and neither belongs on a server anyone can reach.
      STALWART_RECOVERY_ADMIN: "admin:carrel-admin"
      # Recovery mode runs the recovery listener and **nothing else**: an
      # ordinary account authenticates on it and is then refused, and even
      # the administrator's DAV homes answer 404. So the stand comes up in
      # recovery mode to be provisioned through the management API, and is
      # brought up again without it to serve DAV (23.09.2026).
      STALWART_RECOVERY_MODE: "${CARREL_STALWART_RECOVERY:-0}"
    volumes:
      - ./testdata/stalwart/config.json:/etc/stalwart/config.json:ro
      - stalwart-data:/var/lib/stalwart

  # The CLI: it provisions the stand from plan.ndjson, and it is also how
  # the server is asked about itself — `describe` prints the schema and
  # `snapshot` the canonical shape of what is there. Both answers settled
  # more questions on 23.09.2026 than the documentation did.
  stalwart-setup:
    image: stalwartlabs/cli
    depends_on:
      - stalwart
    environment:
      STALWART_URL: "http://stalwart:8080"
      STALWART_USER: "admin"
      STALWART_PASSWORD: "carrel-admin"
    volumes:
      - ./testdata/stalwart:/work:ro
    working_dir: /work
    # No entrypoint of our own: the image's own entrypoint is the CLI, and
    # it has no shell to wrap it in — the first live run answered
    # `exec: "sh": executable file not found in $PATH` (22.09.2026).
    profiles:
      - setup


  # Xandikos: the second light engine beside Radicale, sharing no code
  # with it — Python, every collection a git repository. It asks for no
  # credentials; a bare instance is meant to sit behind a proxy that does
  # the asking, and on loopback there is nothing to protect. That makes it
  # the one server in the lineup where Carrel connects with a login and no
  # password at all.
  #
  # DEFAULTS makes the first calendar and address book, without which the
  # server starts empty and discovery has nothing to find.
  xandikos:
    # A release, not :latest. On 22.09.2026 :latest answered every
    # addressbook-query with 500 and an AttributeError of its own
    # ('CardDAVFilter' object has no attribute 'add_prop_filter'); every
    # released tag from v0.2.10 to v0.2.12 answered 207. Pinning :latest
    # for a stand means testing against whatever is broken upstream today,
    # and it cost an afternoon that looked like a server behaviour worth
    # recording.
    image: ghcr.io/jelmer/xandikos:v0.2.12
    # The release images run as a user that cannot write a fresh named
    # volume — they die with PermissionError on /data/user/ — while
    # :latest can. This is a stand on loopback with a throwaway volume,
    # so root is the cheap answer; a production deployment would give the
    # volume the right owner instead.
    user: "root"
    ports:
      - "127.0.0.1:8081:8000"
    environment:
      DEFAULTS: "true"
      AUTOCREATE: "true"
      CURRENT_USER_PRINCIPAL: "/user/"
    volumes:
      - xandikos-data:/data


  # Davis: sabre/dav with a Symfony admin over it — the same engine as
  # Baikal and Nextcloud, so it is here for completeness rather than for
  # news. The standalone image carries Caddy, so it is one container and
  # not the nginx-plus-FPM pair the project's own compose files use.
  #
  # First run 24.09.2026 on the Linux machine. The DAV account is made
  # through the admin screens' own form, by a script and not by hand
  # (testdata/davis/make-account.sh; testdata/davis/README.md).
  davis:
    image: ghcr.io/tchapi/davis-standalone:latest
    ports:
      - "127.0.0.1:8082:9000"
    environment:
      APP_ENV: "prod"
      APP_SECRET: "carrel-stand-not-a-secret"
      APP_TIMEZONE: "Europe/Moscow"
      # Four slashes: an absolute path, and no quotes, so Symfony resolves it.
      DATABASE_DRIVER: "sqlite"
      DATABASE_URL: sqlite:////data/davis-database.db
      # The admin screens, whose form makes the one DAV account.
      ADMIN_LOGIN: "admin"
      ADMIN_PASSWORD: "carrel-admin"
      ADMIN_AUTH_BYPASS: "false"
      AUTH_METHOD: "Basic"
      AUTH_REALM: "SabreDAV"
      CALDAV_ENABLED: "true"
      CARDDAV_ENABLED: "true"
      # Davis serves files too, and a server that serves a protocol is run
      # against it (docs/servers.md). Its WebDAV wants directories that
      # exist and that PHP may write: without them every DAV request, the
      # calendars' too, is a 500 — the first run found exactly that. Homes
      # are off by default; each account gets one here, outside the public
      # directory, as Davis's own .env advises.
      WEBDAV_ENABLED: "true"
      WEBDAV_TMP_DIR: "/data/webdav/tmp"
      WEBDAV_PUBLIC_DIR: "/data/webdav/public"
      WEBDAV_HOMES_DIR: "/data/webdav/homes"
    volumes:
      - davis-data:/data

  # One shot: the migrations, which Davis does not run for itself. Until
  # they have run the database has no tables and every screen is a 500.
  # Then the data belongs to www-data, which PHP runs as: the migrations
  # run as root, and a database root made is one PHP can read and not write
  # — «attempt to write a readonly database» on the first form (24.09.2026).
  davis-setup:
    image: ghcr.io/tchapi/davis-standalone:latest
    depends_on:
      - davis
    environment:
      APP_ENV: "prod"
      APP_SECRET: "carrel-stand-not-a-secret"
      DATABASE_DRIVER: "sqlite"
      DATABASE_URL: sqlite:////data/davis-database.db
    volumes:
      - davis-data:/data
    entrypoint:
      - sh
      - -c
      - "bin/console doctrine:migrations:migrate --no-interaction && mkdir -p /data/webdav/tmp /data/webdav/public /data/webdav/homes && chown -R www-data:www-data /data"
    profiles:
      - setup

  # DAViCal: PHP over PostgreSQL, old and still deployed, and not sabre/dav.
  # The project ships no image; fintechstudios/davical is built on the
  # official php:apache image, tagged by DAViCal release — 1.1.12 is the
  # last one (March 2023). It creates the database and the DAViCal admin
  # itself when RUN_MIGRATIONS_AT_STARTUP is set, with a PostgreSQL
  # superuser to do it with (testdata/davical/README.md).
  davical-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "carrel-postgres"
    volumes:
      - davical-db:/var/lib/postgresql/data

  davical:
    image: fintechstudios/davical:1.1.12
    ports:
      - "127.0.0.1:8083:80"
    depends_on:
      - davical-db
    environment:
      PGHOST: "davical-db"
      PGPASSWORD: "carrel-davical-app"
      RUN_MIGRATIONS_AT_STARTUP: "true"
      ROOT_PGUSER: "postgres"
      ROOT_PGPASSWORD: "carrel-postgres"
      DAVICAL_ADMIN_PASS: "carrel-admin"

volumes:
  radicale-data:
  stalwart-data:
  xandikos-data:
  davis-data:
  davical-db:
