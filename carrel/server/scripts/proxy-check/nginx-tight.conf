# As many people leave it: default buffering, the default 1 MB body ceiling.
server {
    listen 80;
    server_name nginx-pc;
    location / {
        proxy_pass http://carrel-pc:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /dav/ {
        proxy_pass http://carrel-pc:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
