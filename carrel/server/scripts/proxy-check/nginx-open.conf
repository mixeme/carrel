# As S-28.1 asks: no body ceiling, no buffering of the event stream.
server {
    listen 80;
    server_name nginx-pc;
    client_max_body_size 0;
    proxy_read_timeout 120s;
    location /app/search/progress/ {
        proxy_pass http://carrel-pc:8080;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / {
        proxy_pass http://carrel-pc:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # No URI after the address: nginx passes the path as the client sent it.
    # With one ("…:8081/") it decodes the path first, %2F becomes /, and the
    # collection's address breaks. davloom takes the /dav prefix itself.
    location /dav/ {
        proxy_pass http://carrel-pc:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
